services:
  postgres_test:
    image: postgres:18-alpine
    container_name: kanban_postgres_test
    environment:
      - POSTGRES_USER=mcvent
      - POSTGRES_PASSWORD=mcvent
      - POSTGRES_DB=kanbanchick_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/

volumes:
  postgres_test_data: