services:
  postgres:
    image: postgres:18-alpine
    container_name: kanban_postgres
    environment:
      POSTGRES_USER: mcvent
      POSTGRES_PASSWORD: mcvent
      POSTGRES_DB: kanbanchick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcvent -d kanbanchick"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kanban_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 900 1 --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: kanban_postgres_data
  redis_data:
    name: kanban_redis_data